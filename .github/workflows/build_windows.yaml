# Build the game on Windows,
# creating a Windows executable as a workflow artifact
name: Build on Windows

on:
  push:
  pull_request:

jobs:
  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          modules: 'qtmultimedia'
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        shell: cmd
        run: |
          mkdir build
          cd build
          qmake ..\martiancafetuinematycoon.pro
          nmake release

      - name: Collect the executable and the Qt libraries it needs
        shell: cmd
        run: |
          mkdir martiancafetuinematycoon
          copy build\release\martiancafetuinematycoon.exe martiancafetuinematycoon\
          copy LICENSE martiancafetuinematycoon\
          windeployqt --release --no-translations martiancafetuinematycoon\martiancafetuinematycoon.exe

      - uses: actions/upload-artifact@v4
        with:
          name: martiancafetuinematycoon_windows
          path: martiancafetuinematycoon
